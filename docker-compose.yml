version: '3.8'

networks:
  dbnet:

services:
  postgres:
    image: postgres
    container_name: postgresdb
    environment:
      POSTGRES_USER: admin                # Default user
      POSTGRES_PASSWORD: admin            # Default password
      # No POSTGRES_DB, will use default: postgres
    ports:
      - "5432:5432"
    networks:
      - dbnet
    volumes:
      - pgdata:/var/lib/postgresql/data

    # 🔑 Connect via:
    # docker exec -it postgresdb psql -U admin -d postgres

  mysql:
    image: mysql
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root           # Default root user
      # No MYSQL_DATABASE, starts with internal system DBs only
    ports:
      - "3306:3306"
    networks:
      - dbnet
    volumes:
      - mysqldata:/var/lib/mysql

    # 🔑 Connect via:
    # docker exec -it mysqldb mysql -u root -p

  mssql:
    image: mcr.microsoft.com/mssql/server
    container_name: mssqldb
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123"      # Default sa user
      MSSQL_PID: "Express"
    ports:
      - "11433:1433"
    networks:
      - dbnet
    volumes:
      - mssql-data:/var/opt/mssql

    # 🔑 Connect via:
    # docker exec -it mssqldb /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Password123

volumes:
  pgdata:
  mysqldata:
  mssql-data:


